aid: tejas-networks-india
name: Tejas Networks India
description: >-
  Tejas Networks is a Bengaluru, India-based optical and data networking products company
  that designs, develops and manufactures telecom networking equipment for communications
  service providers, internet and cable operators, utilities, defence and government agencies
  worldwide. Its portfolio spans optical transport (DWDM/OTN), packet transport, broadband
  access (GPON/fiber) and wireless (4G/5G radio access) systems deployed across more than 75
  countries. The company is publicly listed in India (NSE/BSE TEJASNET) and is majority owned
  by the Tata Group; Battery Ventures was an early institutional investor. Tejas Networks is a
  hardware and network-infrastructure vendor and does not currently publish a public developer
  API, developer portal or SDK program.
